spring:
    application:
        name: sql-query-from-liquibase
    h2:
        console:
            enabled: true
            settings:
                web-allow-others: true
                trace: true
    datasource:
        driverClassName: org.h2.Driver
        username: sa
        password: password
        url: jdbc:h2:mem:testDb;
    liquibase:
        enabled: true
        change-log: classpath:/sample-blog-liquibase/liquibase/changelog/changelog.yml
        liquibase-schema: PUBLIC
        default-schema: BLOG_SCHEMA
        database-change-log-table: ${spring.application.name}_changeLog
        database-change-log-lock-table: ${spring.application.name}_logLock


logging.level:
  liquibase: DEBUG